# ──────────────────────────────────────────────────────────────────────────────
# OpenZync MCP Server — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Stages:
#   changelog-check  → Verify towncrier fragment exists (pull requests)
#   changelog        → Build CHANGELOG.md from fragments (tag push)
#   build-and-deploy → Build Docker image, push to ghcr.io, deploy on VPS
#
# Triggers:
#   - Tag push (v*)      → changelog + build + push + deploy (release)
#   - Pull request       → changelog-check only
#   - workflow_dispatch  → build + push + deploy (manual)
#
# Uses the same deploy pattern as openzync-frontend/.github/workflows/deploy.yml:
# build → push to ghcr.io → upload compose file → SSH to VPS → pull + restart.
#
# Required repo secrets:
#   VPS_HOST          — VPS IP/hostname
#   VPS_USER          — SSH user on the VPS (deploy)
#   VPS_SSH_KEY       — ed25519 private key for VPS SSH access
#   OPENZYN_API_KEY   — OpenZync API key for the MCP server
#   OPENZYN_BASE_URL  — OpenZync API base URL (https://app.openzync.tech)
# Note: GHCR images are public since 2026-08-31 — no pull auth needed (GITHUB_TOKEN handles push).
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy MCP Server

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changelog-check:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'trivial') && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install towncrier>=24
      - name: Check changelog fragment
        run: |
          base="${{ github.base_ref }}"
          if [ -z "$base" ]; then base="main"; fi
          if git rev-parse --verify "origin/$base" >/dev/null 2>&1; then
            ref="origin/$base"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            ref="origin/main"
          else
            ref="origin/master"
          fi
          echo "Checking fragments against $ref (base: $base)..."
          towncrier check --compare-with "$ref"

  changelog:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install towncrier>=24
      - name: Build changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building CHANGELOG for $VERSION (tag $GITHUB_REF_NAME)..."
          towncrier build --version "$VERSION" --yes || {
            echo "towncrier build found no fragments — skipping commit"
            exit 0
          }
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changelog.d/
          git commit -m "docs(changelog): update for $GITHUB_REF_NAME [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}" 2>&1 || { echo "push failed — check branch protection"; true; }

  build-and-deploy:
    if: ${{ always() && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [changelog]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${GITHUB_SHA}"
          fi
          docker build -t ghcr.io/openzync/openzync-mcp:$TAG -f openzync_mcp/Dockerfile .
          docker tag ghcr.io/openzync/openzync-mcp:$TAG ghcr.io/openzync/openzync-mcp:latest
          docker push --all-tags ghcr.io/openzync/openzync-mcp

      - name: Upload deployment files to VPS
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER }}"
          TARGET="/home/deploy/openzync"

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "mkdir -p ${TARGET}/deploy"

          tar czf /tmp/deploy-files.tar.gz \
            deploy/mcp-docker-compose.yml

          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/deploy-files.tar.gz \
            "${USER}@${HOST}:${TARGET}/"

      - name: Extract and deploy MCP container
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENZYN_API_KEY: ${{ secrets.OPENZYN_API_KEY }}
          OPENZYN_BASE_URL: ${{ secrets.OPENZYN_BASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPENZYN_API_KEY,OPENZYN_BASE_URL
          script: |
            cd /home/deploy/openzync
            tar xzf deploy-files.tar.gz
            rm deploy-files.tar.gz

            # GHCR images are public since 2026-08-31 — no docker login needed

            cat > deploy/mcp.env <<'ENVEOF'
            OPENZYN_API_KEY=$OPENZYN_API_KEY
            OPENZYN_BASE_URL=$OPENZYN_BASE_URL
            ENVEOF

            docker compose -f deploy/mcp-docker-compose.yml pull mcp
            docker compose -f deploy/mcp-docker-compose.yml up -d mcp
