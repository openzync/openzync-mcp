[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openzync-mcp"
version = "1.0.0b2"
description = "MCP (Model Context Protocol) server for OpenZync — agent memory tools for any MCP-compatible client."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Rohan Shaw", email = "rohnsha0@gmail.com" },
]
keywords = ["mcp", "agent", "memory", "openzync", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "openzync>=1.0.0b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/rohnsha0/openzync"
Source = "https://github.com/rohnsha0/openzync"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
