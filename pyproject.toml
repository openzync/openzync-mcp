[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "openzync-mcp"
dynamic = ["version"]
description = "MCP (Model Context Protocol) server for OpenZync — agent memory tools for any MCP-compatible client."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Rohan Shaw", email = "rohnsha0@gmail.com" },
]
keywords = ["mcp", "agent", "memory", "openzync", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "openzync>=1.0.0b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "towncrier>=24",
]

[project.urls]
Homepage = "https://github.com/rohnsha0/openzync"
Source = "https://github.com/rohnsha0/openzync"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.0b2"
raw-options = { search_parent_directories = true, local_scheme = "no-local-version" }

[tool.hatch.build.targets.sdist]
include = ["/openzync_mcp"]

[tool.hatch.build.targets.wheel]
packages = ["openzync_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "changelog.d/template.j2"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
underlines = ["", "", ""]
orphan_prefix = "trivial"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Docs"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false
